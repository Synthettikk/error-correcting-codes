[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecc-fundamentals"
version = "0.1.0"
description = "Learning Error-Correcting Codes from scratch"
requires-python = ">=3.9"
dependencies = [
    "galois>=0.3.7",
    "numpy>=1.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools]
packages = ["src"]
